server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support React Router SPA (redirect 404 to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for API (Bypasses CORS entirely)
    location /api/ {
        proxy_pass https://api.pharmacy.cmu.ac.th/smart_pharmacy/EventCheck-in/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.pharmacy.cmu.ac.th;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy for PDF downloads
    location /pdf/ {
        proxy_pass https://api.pharmacy.cmu.ac.th/smart_pharmacy/EventCheck-in/pdf/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.pharmacy.cmu.ac.th;
    }

    # Cache static assets (Vite hash files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
